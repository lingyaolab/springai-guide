name: Deploy site

# 发布物：spring-ai-learn/（纯静态，零构建）
# 首次使用：仓库 Settings → Pages → Source 选择 GitHub Actions

# Pages 未启用时保持手动触发，避免每次 push 都出现 Configure Pages 失败。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild search index
        run: node tools/build-search-index.cjs

      - name: Static checks
        run: node tools/check-site.cjs --quiet

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: spring-ai-learn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

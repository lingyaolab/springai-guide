<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="页面不存在：回到 Spring AI 2.0.2 学习站首页，或用顶栏搜索查找章节与报错。" />
    <title>404 · Spring AI 学习站</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8fc;
        color: #1b2430;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.7;
      }
      .card {
        width: min(560px, 100%);
        padding: 32px 28px 26px;
        background: #ffffff;
        border: 1px solid #d9e0ea;
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(20, 40, 80, 0.08);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        color: #3f7d20;
        text-decoration: none;
      }
      .brand .logo { font-size: 16px; }
      h1 { margin: 14px 0 6px; font-size: 40px; line-height: 1.15; letter-spacing: 0.5px; }
      h1 span { color: #3f7d20; }
      p { margin: 0 0 10px; color: #4a5768; font-size: 15px; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 6px; }
      .links a {
        padding: 8px 14px;
        border: 1px solid #d9e0ea;
        border-radius: 9px;
        background: #f6f8fc;
        color: #1b2430;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .links a.primary { background: #3f7d20; border-color: #3f7d20; color: #fff; }
      .links a:hover { border-color: #3f7d20; color: #3f7d20; }
      .links a.primary:hover { color: #fff; }
      .tip { margin-top: 18px; font-size: 13px; color: #6b7789; }
      code {
        padding: 1px 6px;
        border-radius: 5px;
        background: #eef2f8;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0e1116; color: #e6edf3; }
        .card { background: #141a21; border-color: #33404f; box-shadow: none; }
        p { color: #a9b4c0; }
        .links a { background: #1a212a; border-color: #33404f; color: #e6edf3; }
        .links a.primary { background: #3f7d20; border-color: #3f7d20; color: #fff; }
        .tip { color: #7d8896; }
        code { background: #1a212a; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="index.html" data-rel="index.html"><span class="logo">◆</span>Spring AI 学习站</a>
      <h1>404 <span>这一页不在站里</span></h1>
      <p>可能是旧版本留下的链接，也可能地址里少了一个字。</p>
      <p>回到首页后，用顶栏搜索（按 <code>/</code>）可以直接搜章节、概念和报错原文。</p>
      <div class="links">
        <a class="primary" href="index.html" data-rel="index.html">回到首页</a>
        <a href="chapters/00-study-map.html" data-rel="chapters/00-study-map.html">00 学习地图</a>
        <a href="chapters/01-setup.html" data-rel="chapters/01-setup.html">01 环境与依赖</a>
      </div>
      <p class="tip">站内所有链接在发布前都做过全量校验；如果你是从站内点进来的，说明这里确实缺页，欢迎反馈。</p>
    </main>
    <script>
      // 404 会被服务在任意深度：从当前目录逐级向上找带 assets/nav.js 的站点根，
      // 找到后把所有入口改成绝对路径，避免相对链接在深层 URL 下指错。
      (function () {
        var dirs = [];
        var p = location.pathname.replace(/[^/]*$/, "");
        for (var i = 0; i < 8 && p && p !== "/"; i++) {
          dirs.push(p);
          p = p.replace(/[^/]*\/$/, "");
        }
        dirs.push("/");
        var links = document.querySelectorAll("a[data-rel]");
        function use(root) {
          Array.prototype.forEach.call(links, function (a) {
            a.href = root + a.getAttribute("data-rel");
          });
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.href = root + "assets/favicon.svg";
        }
        (function probe(i) {
          if (i >= dirs.length) return;
          fetch(dirs[i] + "assets/nav.js", { cache: "no-store" })
            .then(function (r) {
              if (r.ok) use(dirs[i]);
              else probe(i + 1);
            })
            .catch(function () {
              probe(i + 1);
            });
        })(0);
      })();
    </script>
  </body>
</html>
